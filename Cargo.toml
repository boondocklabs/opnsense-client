[package]
name = "opnsense-client"
version = "0.1.0"
edition = "2024"
description = "Asynchronous OPNsense API client for Tokio"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["opnsense", "firewall", "tokio", "api", "sse"]
categories = ["api-bindings", "network-programming", "asynchronous"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*", ".env.example"]

[dependencies]
bytes = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
webpki-root-certs = "1"

[dev-dependencies]
dotenvy = "0.15"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
